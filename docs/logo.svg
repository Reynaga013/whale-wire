<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Whale tail (fluke), simple geometric silhouette, centered with safe
       margin for maskable icon masking on Android. -->
  <g transform="translate(70,58) scale(3.75)">
    <path d="M 50 92
             C 47 78, 43 66, 40 56
             C 36 44, 26 36, 12 32
             C 6 30, 3 27, 3 22
             C 3 18, 6 17, 10 18
             C 24 21, 36 28, 43 39
             C 45 43, 44 47, 44 50
             C 46 52.5, 48 53.5, 50 53.5
             C 52 53.5, 54 52.5, 56 50
             C 56 47, 55 43, 57 39
             C 64 28, 76 21, 90 18
             C 94 17, 97 18, 97 22
             C 97 27, 94 30, 88 32
             C 74 36, 64 44, 60 56
             C 57 66, 53 78, 50 92 Z"
          fill="#F2F2F7"/>
  </g>

  <!-- "Wire": a market-line trace crossing through the tail's stem, tying
       Whale + Wire together. Bold enough to still read at favicon size. -->
  <path d="M 84 296
           C 136 296, 148 252, 200 260
           C 250 268, 262 220, 312 232
           C 350 241, 362 232, 428 236"
        fill="none" stroke="#D9A24B" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="200" cy="260" r="11" fill="#D9A24B"/>
  <circle cx="312" cy="232" r="11" fill="#D9A24B"/>
</svg>
